name: Build N45 SUSFS variant

on:
  push:
    branches:
      - gxterkernl-joyeuse-rev187-xxksu33020-susfs220
      - gxterkernl-joyeuse-rev187-ksun-susfs220
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout variant
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio curl flex git libelf-dev \
            libssl-dev libxml2-dev lz4 python3 rsync unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build and package
        run: |
          sed -i 's/flags=re.M)/flags=re.M | re.S)/' scripts/gx/apply-bpf-mmapable-array-v2.sh
          bash scripts/gx/apply-netbpfload-bpf-debug.sh
          python3 - <<'PY'
          from pathlib import Path
          display = 'Gxterkernl-joyeuse-4.14.357-rev187'
          p = Path('kernel/sys.c')
          s = p.read_text()
          old = '''\tif (!strncmp(current->comm, "bpfloader", 9) ||
          \t    !strncmp(current->comm, "netbpfload", 10) ||
          \t    !strncmp(current->comm, "netd", 4)) {'''
          new = '''\tif (!strncmp(current->comm, "bpfloader", 9) ||
          \t    !strncmp(current->comm, "netd", 4)) {'''
          if old not in s:
              raise SystemExit('netbpfload uname spoof anchor not found')
          s = s.replace(old, new, 1)
          anchor = '''\t\tstrcpy(tmp.release, "5.4.0");
          \t\tpr_debug("fake uname: %s/%d release=%s\\n",
          \t\t\t current->comm, current->pid, tmp.release);
          \t}'''
          replacement = f'''\t\tstrcpy(tmp.release, "5.4.0");
          \t\tpr_debug("fake uname: %s/%d release=%s\\n",
          \t\t\t current->comm, current->pid, tmp.release);
          \t}} else if (!strcmp(current->comm, "uname") ||
          \t\t   !strcmp(current->comm, "toybox")) {{
          \t\tstrcpy(tmp.release, "{display}");
          \t}}'''
          if anchor not in s:
              raise SystemExit('uname display anchor not found')
          p.write_text(s.replace(anchor, replacement, 1))
          PY

          set +e
          set -o pipefail
          bash scripts/gx/build-n45.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-compile.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo '::group::First compiler/linker diagnostics'
            grep -nE '(^|[[:space:]])(error:|fatal error:|undefined reference|ld\.lld: error:|make(\[[0-9]+\])?: \*\*\*)' \
              "$GITHUB_WORKSPACE/build-compile.log" | head -160 || true
            echo '::endgroup::'
            tail -250 "$GITHUB_WORKSPACE/build-compile.log" || true
          fi
          exit "$status"

      - name: Verify SUSFS lane
        run: |
          set -euo pipefail
          source .gx-variant
          internal='4.14.357-Gxterkernl-joyeuse-rev187'
          display='Gxterkernl-joyeuse-4.14.357-rev187'
          actual="$(cat out/include/config/kernel.release)"
          test "$actual" = "$internal"
          grep -Fxq "#define UTS_RELEASE \"$internal\"" out/include/generated/utsrelease.h
          case "$actual" in *XXKSU*|*KSUN*|*NOSUSFS*|*SUSFS*) exit 20 ;; esac

          test "$GX_SUSFS" = '1'
          grep -Fxq 'CONFIG_KSU=y' out/.config
          grep -Fxq 'CONFIG_KSU_SUSFS=y' out/.config
          grep -Fq '#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h
          grep -Fxq 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config
          grep -Fxq 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' out/.config
          grep -Fxq 'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' out/.config
          grep -Fxq 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' out/.config
          grep -Fxq 'CONFIG_KSU_SUSFS_SUS_MAP=y' out/.config
          ! grep -Fxq 'CONFIG_KSU_SUSFS_SUS_PATH=y' out/.config
          ! grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' out/.config

          image="out/arch/arm64/boot/Image.gz"
          strings_file="$RUNNER_TEMP/susfs-image.strings"
          gzip -dc "$image" | strings > "$strings_file"
          grep -Fxq "$internal" "$strings_file"
          grep -Fxq "$display" "$strings_file"

          if [[ "$GX_ROOT" == 'xxksu' ]]; then
            source gx-sources.lock
            test "$XXKSU_TAG" = 'v3.3.0-20'
            test "$XXKSU_COMMIT" = '43e9bc2a5634ed5eb2be40268bdd4526eca6fd44'
            test "$(git -C KernelSU rev-parse HEAD)" = "$XXKSU_COMMIT"
            grep -R -m1 -Eq 'KERNEL_SU_UAPI_VERSION[^0-9]+3([^0-9]|$)' KernelSU/kernel KernelSU/userspace 2>/dev/null
            grep -Fq 'static atomic_t throne_tracker_running = ATOMIC_INIT(0);' KernelSU/kernel/manager/throne_tracker.c
            ! grep -Fq 'set_user_nice(current, -10);' KernelSU/kernel/manager/throne_tracker.c
            grep -Fq 'config KSU_SUSFS' KernelSU/kernel/Kconfig
          elif [[ "$GX_ROOT" == 'ksun' ]]; then
            source gx-sources.lock
            test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSUN_SUSFS_COMMIT"
            grep -Fxq 'CONFIG_KSU_MANUAL_HOOK=y' out/.config
            ! grep -Fxq 'CONFIG_KSU_KPROBES_HOOK=y' out/.config

            # sidex legacy-susfs-v2 carries its own DirtySepolicy view. Verify
            # the exact app-only guards and 4.14 fake-status semantics instead
            # of stacking the no-SUSFS #228 shim onto the same hooks.
            hide='KernelSU-Next/kernel/feature/selinux_hide.c'
            grep -Fq 'current_uid().val < 10000' "$hide"
            grep -Fq 'test_thread_flag(TIF_SECCOMP)' "$hide"
            grep -Fq 'ksu_selinux_transaction_write' "$hide"
            grep -Fq 'ksu_hide_setprocattr' "$hide"
            grep -Fq 'ksu_slow_avc_audit' "$hide"
            grep -Fq 'fake_status->enforcing = 1;' "$hide"
            grep -Fq 'fake_status->sequence = 0;' "$hide"
            grep -Fq 'fake_status->policyload = 0;' "$hide"
            grep -Fq 'filp->private_data = ksu_fake_status_page;' "$hide"
            grep -Fq 'ksu_init_hook_selinux_transaction_write();' "$hide"
            grep -Fq 'ksu_init_hook_selinux_status_open();' "$hide"
            grep -Fq 'ksu_add_shit_to_list' KernelSU-Next/kernel/feature/selinux_hide.h
            grep -Fq '#include "feature/selinux_hide.c"' KernelSU-Next/kernel/selinux/rules.c

            # Preserve the #228 lifecycle/Zygisk path in the actual Image.
            grep -Fq 'read init.rc, comm:' "$strings_file"
            grep -Fq 'read_proxy: orig read finished, start append rc' "$strings_file"
            grep -Fq 'on_post_fs_data!' "$strings_file"
          else
            echo "unexpected root lane: $GX_ROOT" >&2
            exit 21
          fi

          zip="artifacts/$GX_ZIP"
          test -s "$zip"
          unzip -tqq "$zip"
          sha256sum "$zip" > "$zip.sha256"
          md5sum "$zip" > "$zip.md5"
          echo "[SUSFS] verified root=$GX_ROOT version=2.2.0"

      - name: Upload failed-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n45-susfs-build-log-${{ github.run_number }}
          path: build-compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload flashable ZIP and metadata
        uses: actions/upload-artifact@v4
        with:
          name: n45-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
