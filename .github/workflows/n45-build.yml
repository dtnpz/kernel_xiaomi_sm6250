name: Build N45 variant

on:
  push:
    branches:
      - miatoll-nexus45-nbp
      - miatoll-nexus45-nbp-xxksu
      - miatoll-nexus45-nbp-ksun
      - miatoll-nexus45-nbp-xxksu-nosusfs
      - miatoll-nexus45-nbp-ksun-nosusfs
      - miatoll-nexus45-bp
      - miatoll-nexus45-bp-xxksu
      - miatoll-nexus45-bp-ksun
      - miatoll-nexus45-bp-xxksu-nosusfs
      - miatoll-nexus45-bp-ksun-nosusfs
      - gxterkernl-joyeuse-4.14.357-rev187
      - gxterkernl-joyeuse-rev187-xxksu33020
      - gxterkernl-joyeuse-rev187-xxksu33030
      - gxterkernl-joyeuse-4.14.357-rev187-multiksu
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout variant
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio curl flex git libelf-dev \
            libssl-dev libxml2-dev lz4 python3 rsync unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build and package
        run: |
          sed -i 's/flags=re.M)/flags=re.M | re.S)/' scripts/gx/apply-bpf-mmapable-array-v2.sh
          bash scripts/gx/apply-netbpfload-bpf-debug.sh
          python3 - <<'PY'
          from pathlib import Path

          display = 'gxt-4.14.357'
          p = Path('kernel/sys.c')
          s = p.read_text()
          old = '''\tif (!strncmp(current->comm, "bpfloader", 9) ||
          \t    !strncmp(current->comm, "netbpfload", 10) ||
          \t    !strncmp(current->comm, "netd", 4)) {'''
          new = '''\tif (!strncmp(current->comm, "bpfloader", 9) ||
          \t    !strncmp(current->comm, "netd", 4)) {'''
          if old not in s:
              raise SystemExit('netbpfload uname spoof anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''\t\tstrcpy(tmp.release, "5.4.0");
          \t\tpr_debug("fake uname: %s/%d release=%s\\n",
          \t\t\t current->comm, current->pid, tmp.release);
          \t}'''
          replacement = f'''\t\tstrcpy(tmp.release, "5.4.0");
          \t\tpr_debug("fake uname: %s/%d release=%s\\n",
          \t\t\t current->comm, current->pid, tmp.release);
          \t}} else if (!strcmp(current->comm, "uname") ||
          \t\t   !strcmp(current->comm, "toybox")) {{
          \t\tstrcpy(tmp.release, "{display}");
          \t}}'''
          if anchor not in s:
              raise SystemExit('uname display anchor not found')
          p.write_text(s.replace(anchor, replacement, 1))
          print(f'[uname] uname/toybox display={display}; shared GXT identity')
          PY

          set +e
          set -o pipefail
          bash scripts/gx/build-n45.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-compile.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo '::group::First compiler/linker diagnostics'
            grep -nE '(^|[[:space:]])(error:|fatal error:|undefined reference|ld\.lld: error:|make(\[[0-9]+\])?: \*\*\*)' \
              "$GITHUB_WORKSPACE/build-compile.log" | head -120 || true
            echo '::endgroup::'
            echo '::group::Build log tail'
            tail -250 "$GITHUB_WORKSPACE/build-compile.log" || true
            echo '::endgroup::'
          fi
          exit "$status"

      - name: Verify clean rev187 identity
        if: github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187' || github.ref_name == 'gxterkernl-joyeuse-rev187-xxksu33020' || github.ref_name == 'gxterkernl-joyeuse-rev187-xxksu33030' || github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187-multiksu'
        run: |
          set -euo pipefail
          internal='4.14.357-gxt'
          display='gxt-4.14.357'
          actual="$(cat out/include/config/kernel.release)"
          printf 'internal kernel.release: %s\n' "$actual"
          test "$actual" = "$internal"
          grep -Fxq "#define UTS_RELEASE \"$internal\"" out/include/generated/utsrelease.h

          image="out/arch/arm64/boot/Image.gz"
          strings_file="$RUNNER_TEMP/rev187-image.strings"
          test -s "$image"
          gzip -dc "$image" | strings > "$strings_file"
          grep -Fxq "$internal" "$strings_file"
          grep -Fq "Linux version $internal" "$strings_file"
          grep -Fxq "$display" "$strings_file"
          if grep -Fq '4.14.357-Gxter-XXKSU330-NOSUSFS-NBP-FuckMiatollCommu' "$strings_file"; then
            echo 'old feature-labelled UTS identity still present in kernel Image' >&2
            exit 9
          fi

          grep -Fq 'rev187 clean-name compatibility' kernel/module.c
          grep -Fq 'strcpy(tmp.release, "gxt-4.14.357")' kernel/sys.c

          if [[ "$GITHUB_REF_NAME" == 'gxterkernl-joyeuse-rev187-xxksu33020' ]]; then
            source gx-sources.lock
            test "$XXKSU_TAG" = 'v3.3.0-20'
            test "$XXKSU_COMMIT" = '43e9bc2a5634ed5eb2be40268bdd4526eca6fd44'
            grep -R -m1 -Eq 'KERNEL_SU_UAPI_VERSION[^0-9]+3([^0-9]|$)' KernelSU/kernel KernelSU/userspace 2>/dev/null
            grep -Fq 'static atomic_t throne_tracker_running = ATOMIC_INIT(0);' KernelSU/kernel/manager/throne_tracker.c
            ! grep -Fq 'set_user_nice(current, -10);' KernelSU/kernel/manager/throne_tracker.c
          fi

          if [[ "$GITHUB_REF_NAME" == 'gxterkernl-joyeuse-rev187-xxksu33030' ]]; then
            source gx-sources.lock
            test "$XXKSU_TAG" = 'v3.3.0-30'
            test "$XXKSU_COMMIT" = '86fe5e4ef22917b76a38c23cb55aa081570ff561'
            grep -R -m1 -Eq 'KERNEL_SU_UAPI_VERSION[^0-9]+4([^0-9]|$)' KernelSU/kernel KernelSU/userspace 2>/dev/null
            grep -Fq 'static atomic_t throne_tracker_running = ATOMIC_INIT(0);' KernelSU/kernel/manager/throne_tracker.c
            ! grep -Fq 'set_user_nice(current, -10);' KernelSU/kernel/manager/throne_tracker.c
          fi

          if [[ "$GITHUB_REF_NAME" == 'gxterkernl-joyeuse-4.14.357-rev187-multiksu' ]]; then
            source gx-sources.lock
            test "$XXKSU_TAG" = 'v3.3.0-30'
            test "$XXKSU_COMMIT" = '86fe5e4ef22917b76a38c23cb55aa081570ff561'
            test "$KSUN_RELEASE_TAG" = 'v3.4.0'
            test "$KSUN_RELEASE_COMMIT" = '1a879d6a866f80b1fa1c1009a2ffa747873cbb5e'
            test "$KSUN_MANAGER_UAPI" = '4'
            test "$XXKSU_MANAGER_UAPI" = '4'
            test "$KSUN_MANAGER_CERT_SIZE" = '0x3e6'
            grep -Fq "$KSUN_MANAGER_CERT_HASH" KernelSU/kernel/manager/apk_sign.c
            grep -Fq 'GXT_KSU_UAPI_KSUN 4' KernelSU/kernel/manager/manager_identity.h
            grep -Fq 'GXT_KSU_UAPI_XXKSU 4' KernelSU/kernel/manager/manager_identity.h
            grep -Fq 'gxt_ksu_detect_manager_apk' KernelSU/kernel/manager/apk_sign.c
            grep -Fq 'gxt_ksu_set_manager_identity' KernelSU/kernel/manager/throne_tracker.c
            grep -Fq 'cmd.uapi_version = gxt_ksu_manager_uapi_version();' KernelSU/kernel/supercall/dispatch.c
            grep -Fq 'GXT_KSU_IOCTL_GET_HOOK_MODE' KernelSU/kernel/supercall/dispatch.c
            grep -Fq 'GXT_KSU_IOCTL_GET_VERSION_TAG' KernelSU/kernel/supercall/dispatch.c
            grep -Fq 'static atomic_t throne_tracker_running = ATOMIC_INIT(0);' KernelSU/kernel/manager/throne_tracker.c
            ! grep -Fq 'set_user_nice(current, -10);' KernelSU/kernel/manager/throne_tracker.c
          fi

          source .gx-variant
          zip="artifacts/$GX_ZIP"
          test -s "$zip"
          if [[ "$GITHUB_REF_NAME" == 'gxterkernl-joyeuse-4.14.357-rev187-multiksu' ]]; then
            test "$GX_ZIP" = "gxt-4.14.357-MULTIKSU.zip"
            test "$GX_MULTI_KSU" = "1"
          else
            test "$GX_ZIP" = "gxt-4.14.357-XXKSU.zip"
          fi
          sha256sum "$zip" > "$zip.sha256"
          md5sum "$zip" > "$zip.md5"
          printf 'source_workflow_187_commit=2642d3182aa72b7524f85b6f8b9a4b389c0aa23e\nsource_behavior=r187-input-test\ninternal_uts_release=%s\nuname_display=%s\nidentity_mode=shared-gxt-display\nmodule_compat=ignore-release-token-only\nruntime_root_behavior=preserved-from-r187\n' \
            "$internal" "$display" > "artifacts/${display}.release-info.txt"
          if [[ "$GITHUB_REF_NAME" == 'gxterkernl-joyeuse-rev187-xxksu33020' ]]; then
            source gx-sources.lock
            printf 'xxksu_tag=%s\nxxksu_commit=%s\nxxksu_uapi=3\n' "$XXKSU_TAG" "$XXKSU_COMMIT" >> "artifacts/${display}.release-info.txt"
          fi

          if [[ "$GITHUB_REF_NAME" == 'gxterkernl-joyeuse-rev187-xxksu33030' ]]; then
            source gx-sources.lock
            printf 'xxksu_tag=%s\nxxksu_commit=%s\nxxksu_uapi=4\n' "$XXKSU_TAG" "$XXKSU_COMMIT" >> "artifacts/${display}.release-info.txt"
          fi

          if [[ "$GITHUB_REF_NAME" == 'gxterkernl-joyeuse-4.14.357-rev187-multiksu' ]]; then
            source gx-sources.lock
            printf 'root_lane=multiksu\nnative_backend=xxksu\nxxksu_tag=%s\nxxksu_commit=%s\nxxksu_uapi=%s\nksun_release_tag=%s\nksun_release_commit=%s\nksun_uapi=%s\nksun_manager_cert_size=%s\nksun_manager_cert_hash=%s\nmanager_routing=verified-signer-runtime-personality\n' \
              "$XXKSU_TAG" "$XXKSU_COMMIT" "$XXKSU_MANAGER_UAPI" "$KSUN_RELEASE_TAG" "$KSUN_RELEASE_COMMIT" "$KSUN_MANAGER_UAPI" \
              "$KSUN_MANAGER_CERT_SIZE" "$KSUN_MANAGER_CERT_HASH" >> "artifacts/${display}.release-info.txt"
          fi

      - name: Upload failed-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n45-build-log-${{ github.run_number }}
          path: build-compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload flashable ZIP and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: n45-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Gxterkernl joyeuse rev187 GitHub Release
        if: github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='Gxterkernl-joyeuse-4.14.357-rev187'
          zip="artifacts/${tag}.zip"
          test -s "$zip"
          gh release delete "$tag" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$tag" \
            "$zip" \
            "$zip.sha256" \
            "$zip.md5" \
            "artifacts/${tag}.release-info.txt" \
            "artifacts/REV187.config" \
            "artifacts/REV187.build-info.txt" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes 'Based on workflow #187 source behavior. Runtime root functionality is preserved. Public build naming and uname output use Gxterkernl-joyeuse-4.14.357-rev187. Internal UTS/vermagic uses the conventional version-first clean identity 4.14.357-Gxterkernl-joyeuse-rev187 with no feature labels. Module loading ignores only the first vermagic release-name token while retaining all remaining vermagic checks and normal symbol-version checks.'


      - name: Publish fingerprint race fixed XXKSU release
        if: github.ref_name == 'gxterkernl-joyeuse-rev187-xxksu33030'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .gx-variant
          zip="artifacts/$GX_ZIP"
          test "$GX_ROOT" = "xxksu"
          test "$GX_ZIP" = "gxt-4.14.357-XXKSU.zip"
          test -s "$zip"
          sha256sum "$zip" > "$zip.sha256"
          md5sum "$zip" > "$zip.md5"
          tag='gxt-4.14.357-XXKSU'
          gh release delete "$tag" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$tag" \
            "$zip" "$zip.sha256" "$zip.md5" \
            "artifacts/$GX_VARIANT.config" \
            "artifacts/$GX_VARIANT.build-info.txt" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes 'Fingerprint boot-race fix: FPC and Goodix defer probing until fingerprint vendor detection is ready. Existing internal 4.14.357-gxt and uname/toybox gxt-4.14.357 identity behavior is preserved.'


      - name: Publish MultiKSU UAPI-routed release
        if: github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187-multiksu'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .gx-variant
          zip="artifacts/$GX_ZIP"
          test "$GX_ROOT" = "xxksu"
          test "$GX_MULTI_KSU" = "1"
          test "$GX_ZIP" = "gxt-4.14.357-MULTIKSU.zip"
          test -s "$zip"
          sha256sum "$zip" > "$zip.sha256"
          md5sum "$zip" > "$zip.md5"
          tag='gxt-4.14.357-MULTIKSU'
          gh release delete "$tag" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$tag" \
            "$zip" "$zip.sha256" "$zip.md5" \
            "artifacts/$GX_VARIANT.config" \
            "artifacts/$GX_VARIANT.build-info.txt" \
            "artifacts/gxt-4.14.357.release-info.txt" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes 'Experimental MultiKSU lane. Native engine is pinned backslashxx KernelSU v3.3.0-30 (UAPI4). KernelSU-Next v3.4.0 and xxKSU-compatible managers both use UAPI4; verified signer detection retains separate runtime personalities so KernelSU-Next also receives its hook-mode/version-tag compatibility ioctls. OpenELA 4.14.357 is applied as the complete official OpenELA delta rather than a version-only bump.'
