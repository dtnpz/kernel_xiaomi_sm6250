name: Build N45 variant

on:
  push:
    branches:
      - miatoll-nexus45-nbp
      - miatoll-nexus45-nbp-xxksu
      - miatoll-nexus45-nbp-ksun
      - miatoll-nexus45-nbp-xxksu-nosusfs
      - miatoll-nexus45-nbp-ksun-nosusfs
      - miatoll-nexus45-bp
      - miatoll-nexus45-bp-xxksu
      - miatoll-nexus45-bp-ksun
      - miatoll-nexus45-bp-xxksu-nosusfs
      - miatoll-nexus45-bp-ksun-nosusfs
      - gxterkernl-joyeuse-4.14.357-rev187
      - gxterkernl-joyeuse-4.14.357-rev187-ksun
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout variant
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio curl flex git libelf-dev \
            libssl-dev libxml2-dev lz4 python3 rsync unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build and package
        run: |
          sed -i 's/flags=re.M)/flags=re.M | re.S)/' scripts/gx/apply-bpf-mmapable-array-v2.sh
          bash scripts/gx/apply-netbpfload-bpf-debug.sh
          python3 - <<'PY'
          from pathlib import Path

          display = 'gxt-4.14.357'
          p = Path('kernel/sys.c')
          s = p.read_text()
          android_bpf_compat = '''\tif (!strncmp(current->comm, "bpfloader", 9) ||
          \t    !strncmp(current->comm, "netbpfload", 10) ||
          \t    !strncmp(current->comm, "netd", 4)) {'''
          if android_bpf_compat not in s:
              raise SystemExit('Android BPF uname compatibility anchor not found')
          print('[uname] preserving netbpfload Android 15 compatibility spoof')

          anchor = '''\t\tstrcpy(tmp.release, "4.19.236");
          \t\tpr_debug("fake uname: %s/%d release=%s\\n",
          \t\t\t current->comm, current->pid, tmp.release);
          \t}'''
          replacement = f'''\t\tstrcpy(tmp.release, "4.19.236");
          \t\tpr_debug("fake uname: %s/%d release=%s\\n",
          \t\t\t current->comm, current->pid, tmp.release);
          \t}} else if (!strcmp(current->comm, "uname") ||
          \t\t   !strcmp(current->comm, "toybox")) {{
          \t\tstrcpy(tmp.release, "{display}");
          \t}}'''
          if anchor not in s:
              raise SystemExit('uname display anchor not found')
          p.write_text(s.replace(anchor, replacement, 1))
          print(f'[uname] uname/toybox display={display}; shared GXT identity')
          PY

          set +e
          set -o pipefail
          bash scripts/gx/build-n45.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-compile.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo '::group::First compiler/linker diagnostics'
            grep -nE '(^|[[:space:]])(error:|fatal error:|undefined reference|ld\.lld: error:|make(\[[0-9]+\])?: \*\*\*)' \
              "$GITHUB_WORKSPACE/build-compile.log" | head -120 || true
            echo '::endgroup::'
            echo '::group::Build log tail'
            tail -250 "$GITHUB_WORKSPACE/build-compile.log" || true
            echo '::endgroup::'
          fi
          exit "$status"

      - name: Verify clean rev187 identity
        if: github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187' || github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187-ksun'
        run: |
          set -euo pipefail
          internal='4.14.357-gxt'
          display='gxt-4.14.357'
          actual="$(cat out/include/config/kernel.release)"
          printf 'internal kernel.release: %s\n' "$actual"
          test "$actual" = "$internal"
          grep -Fxq "#define UTS_RELEASE \"$internal\"" out/include/generated/utsrelease.h

          image="out/arch/arm64/boot/Image.gz"
          strings_file="$RUNNER_TEMP/rev187-image.strings"
          test -s "$image"
          gzip -dc "$image" | strings > "$strings_file"
          grep -Fxq "$internal" "$strings_file"
          grep -Fq "Linux version $internal" "$strings_file"
          grep -Fxq "$display" "$strings_file"
          if grep -Fq '4.14.357-Gxter-XXKSU330-NOSUSFS-NBP-FuckMiatollCommu' "$strings_file"; then
            echo 'old feature-labelled UTS identity still present in kernel Image' >&2
            exit 9
          fi

          grep -Fq 'rev187 clean-name compatibility' kernel/module.c
          grep -Fq '!strncmp(current->comm, "netbpfload", 10)' kernel/sys.c
          grep -Fq 'strcpy(tmp.release, "4.19.236")' kernel/sys.c
          grep -Fq 'strcpy(tmp.release, "gxt-4.14.357")' kernel/sys.c

          source .gx-variant
          zip="artifacts/$GX_ZIP"
          test -s "$zip"
          test "$GX_ZIP" = "gxt-4.14.357-KSUN.zip"
          sha256sum "$zip" > "$zip.sha256"
          md5sum "$zip" > "$zip.md5"
          printf 'source_workflow_187_commit=2642d3182aa72b7524f85b6f8b9a4b389c0aa23e\nsource_behavior=r187-input-test\ninternal_uts_release=%s\nuname_display=%s\nidentity_mode=shared-gxt-display\nmodule_compat=ignore-release-token-only\nroot_lane=%s\n' \
            "$internal" "$display" "$GX_ROOT" > "artifacts/${display}.release-info.txt"
          if [[ "$GITHUB_REF_NAME" == 'gxterkernl-joyeuse-4.14.357-rev187-ksun' ]]; then
            source gx-sources.lock
            legacy_tag="$(git -C KernelSU-Next describe --tags --exact-match HEAD)"
            printf 'ksun_release_tag=%s\nksun_release_commit=%s\nksun_legacy_tag=%s\nksun_legacy_branch=%s\nksun_legacy_commit=%s\nksun_legacy_uapi=4\n' \
              "$KSUN_RELEASE_TAG" "$KSUN_RELEASE_COMMIT" "$legacy_tag" "$KSUN_LEGACY_BRANCH" "$KSUN_LEGACY_COMMIT" \
              >> "artifacts/${display}.release-info.txt"
          fi

      - name: Verify KSUN DirtySepolicy parity
        if: github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187-ksun'
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1" >&2
            exit 13
          }
          require_line() {
            local label="$1" needle="$2" file="$3"
            grep -Fq "$needle" "$file" || fail "$label missing: $needle ($file)"
            echo "[KSUN] ok: $label"
          }

          source .gx-variant
          test "$GX_ROOT" = 'ksun' || fail "GX_ROOT is $GX_ROOT, expected ksun"
          test "$GX_SUSFS" = '0' || fail "GX_SUSFS is $GX_SUSFS, expected 0"
          actual_ksun="$(git -C KernelSU-Next rev-parse HEAD)"
          source gx-sources.lock
          test "$KSUN_RELEASE_TAG" = 'v3.4.0' || fail "KSUN release target is $KSUN_RELEASE_TAG"
          test "$KSUN_RELEASE_COMMIT" = '1a879d6a866f80b1fa1c1009a2ffa747873cbb5e' || fail "KSUN v3.4.0 release commit mismatch"
          test "$actual_ksun" = '8af3d4fec33be32fa5d3f8dae4f380fac45bf2cd' || \
            fail "KSUN legacy pin mismatch: $actual_ksun"
          grep -Eq 'KERNEL_SU_UAPI_VERSION[^0-9]+4([^0-9]|$)' KernelSU-Next/uapi/supercall.h || \
            fail 'KernelSU-Next 4.14 v3.4.0 legacy lane is not UAPI4'

          echo '[KSUN] generated KSU config:'
          grep -E '^(CONFIG_KSU|# CONFIG_KSU)' out/.config || true
          grep -Fxq 'CONFIG_KSU=y' out/.config || fail 'CONFIG_KSU=y missing'
          grep -Fxq 'CONFIG_KSU_MANUAL_HOOK=y' out/.config || fail 'CONFIG_KSU_MANUAL_HOOK=y missing'
          # KSU_KPROBES_HOOK depends on !KSU_MANUAL_HOOK. Old Kconfig may omit an
          # invisible n-valued symbol entirely, so verify the semantic condition
          # (not enabled) instead of requiring a particular serialized n line.
          if grep -Fxq 'CONFIG_KSU_KPROBES_HOOK=y' out/.config; then
            fail 'CONFIG_KSU_KPROBES_HOOK unexpectedly enabled'
          fi
          if grep -Fxq 'CONFIG_KSU_SUSFS=y' out/.config; then
            fail 'SUSFS unexpectedly enabled in KSUN no-SUSFS lane'
          fi
          echo '[KSUN] ok: manual-hook/no-SUSFS generated config'

          require_line 'DirtySepolicy helper block' 'N45 DirtySepolicy parity' KernelSU-Next/kernel/feature/selinux_hide.c
          require_line 'SELinux Hide stays available and active' 'static bool ksu_selinux_hide_is_enabled __read_mostly = true;' KernelSU-Next/kernel/feature/selinux_hide.c
          require_line 'stock status sequence' 'new_status->sequence = 0;' KernelSU-Next/kernel/feature/selinux_hide.c
          require_line 'stock status policyload' 'new_status->policyload = 0;' KernelSU-Next/kernel/feature/selinux_hide.c
          require_line '4.14 status page ABI' 'filp->private_data = data;' KernelSU-Next/kernel/feature/selinux_hide.c
          require_line 'ordinary SELinux context checks pass through' 'return orig_selinux_transaction_write(file, buf, size, pos);' KernelSU-Next/kernel/feature/selinux_hide.c
          require_line 'SELinux context probe copied for scoped filtering' 'copy_from_user(scon, buf,' KernelSU-Next/kernel/feature/selinux_hide.c
          require_line 'SELinux hide checks su context' 'u:r:su:' KernelSU-Next/kernel/feature/selinux_hide.c
          require_line 'SELinux hide checks ksu context' 'u:r:ksu:' KernelSU-Next/kernel/feature/selinux_hide.c
          require_line 'SELinux hide rejects explicit root-context probes' 'ksu_selinux_hide: blocked root context check %s from uid=%d' KernelSU-Next/kernel/feature/selinux_hide.c
          require_line 'SELinux hide checks su_system context' 'u:r:su_system:' KernelSU-Next/kernel/feature/selinux_hide.c
          if grep -Fq 'blocked transaction_write from uid=' KernelSU-Next/kernel/feature/selinux_hide.c; then
            fail 'blanket SELinux context rejection still enabled for app UIDs'
          fi
          if grep -Fq 'filp->private_data = page_address(data);' KernelSU-Next/kernel/feature/selinux_hide.c; then
            fail 'newer-kernel status-page ABI leaked into N45 4.14 shim'
          fi
          require_line 'policy command tracking' 'ksu_selinux_hide_track_policy_cmd' KernelSU-Next/kernel/selinux/rules.c
          require_line 'selinuxfs transaction pre-hook' 'ksu_selinux_hide_transaction_pre' security/selinux/selinuxfs.c
          require_line 'selinuxfs transaction post-hook' 'ksu_selinux_hide_transaction_post' security/selinux/selinuxfs.c
          require_line 'setprocattr hidden-context hook' 'ksu_selinux_hide_setprocattr_pre' security/selinux/hooks.c
          require_line 'Simple LMK perceptible-app guard' 'if (adj <= 200 ||' drivers/android/simple_lmk.c
          if grep -Fq 'if (adj < 0 ||' drivers/android/simple_lmk.c; then
            fail 'Simple LMK still allows perceptible/foreground apps as victims'
          fi
          echo '[KSUN] DirtySepolicy + perceptible-app LMK protection verified'

      - name: Upload failed-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n45-build-log-${{ github.run_number }}
          path: build-compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload flashable ZIP and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: n45-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Gxterkernl joyeuse rev187 GitHub Release
        if: github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='Gxterkernl-joyeuse-4.14.357-rev187'
          zip="artifacts/${tag}.zip"
          test -s "$zip"
          gh release delete "$tag" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$tag" \
            "$zip" \
            "$zip.sha256" \
            "$zip.md5" \
            "artifacts/${tag}.release-info.txt" \
            "artifacts/REV187.config" \
            "artifacts/REV187.build-info.txt" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes 'Based on workflow #187 source behavior. Runtime root functionality is preserved. Public build naming and uname output use Gxterkernl-joyeuse-4.14.357-rev187. Internal UTS/vermagic uses the conventional version-first clean identity 4.14.357-Gxterkernl-joyeuse-rev187 with no feature labels. Module loading ignores only the first vermagic release-name token while retaining all remaining vermagic checks and normal symbol-version checks.'

      - name: Publish fingerprint race fixed KSUN release
        if: github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187-ksun'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .gx-variant
          zip="artifacts/$GX_ZIP"
          test "$GX_ROOT" = "ksun"
          test "$GX_ZIP" = "gxt-4.14.357-KSUN.zip"
          test -s "$zip"
          sha256sum "$zip" > "$zip.sha256"
          md5sum "$zip" > "$zip.md5"
          tag='gxt-4.14.357-KSUN'
          gh release delete "$tag" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$tag" \
            "$zip" "$zip.sha256" "$zip.md5" \
            "artifacts/$GX_VARIANT.config" \
            "artifacts/$GX_VARIANT.build-info.txt" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes 'OpenELA 4.14.357 with KernelSU-Next v3.4.0 legacy/manual-hook kernel source (legacy head 8af3d4f, UAPI4) and Manager v3.4.0. SELinux Hide remains available and now passes normal Android app-context validation while filtering explicit su/ksu context probes. Fingerprint boot-race and shared gxt identity behavior are preserved.'
