name: Build N45 variant

on:
  push:
    branches:
      - miatoll-nexus45-nbp
      - miatoll-nexus45-nbp-xxksu
      - miatoll-nexus45-nbp-ksun
      - miatoll-nexus45-nbp-xxksu-nosusfs
      - miatoll-nexus45-nbp-ksun-nosusfs
      - miatoll-nexus45-bp
      - miatoll-nexus45-bp-xxksu
      - miatoll-nexus45-bp-ksun
      - miatoll-nexus45-bp-xxksu-nosusfs
      - miatoll-nexus45-bp-ksun-nosusfs
      - gxterkernl-joyeuse-4.14.357-rev187
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout variant
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio curl flex git libelf-dev \
            libssl-dev libxml2-dev lz4 python3 rsync unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build and package
        run: |
          sed -i 's/flags=re.M)/flags=re.M | re.S)/' scripts/gx/apply-bpf-mmapable-array-v2.sh
          bash scripts/gx/apply-netbpfload-bpf-debug.sh
          bash scripts/gx/apply-clean-vermagic-compat.sh
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kernel/sys.c')
          s = p.read_text()
          old = '''\tif (!strncmp(current->comm, "bpfloader", 9) ||
          \t    !strncmp(current->comm, "netbpfload", 10) ||
          \t    !strncmp(current->comm, "netd", 4)) {'''
          new = '''\tif (!strncmp(current->comm, "bpfloader", 9) ||
          \t    !strncmp(current->comm, "netd", 4)) {'''
          if old not in s:
              raise SystemExit('netbpfload uname spoof anchor not found')
          p.write_text(s.replace(old, new, 1))
          print('[netbpfload-kver] netbpfload sees real clean UTS; bpfloader/netd keep 5.4 compatibility path')
          PY

          set +e
          set -o pipefail
          bash scripts/gx/build-n45.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-compile.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo '::group::First compiler/linker diagnostics'
            grep -nE '(^|[[:space:]])(error:|fatal error:|undefined reference|ld\.lld: error:|make(\[[0-9]+\])?: \*\*\*)' \
              "$GITHUB_WORKSPACE/build-compile.log" | head -120 || true
            echo '::endgroup::'
            echo '::group::Build log tail'
            tail -250 "$GITHUB_WORKSPACE/build-compile.log" || true
            echo '::endgroup::'
          fi
          exit "$status"

      - name: Verify clean rev187 identity
        if: github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187'
        run: |
          set -euo pipefail
          release_name='Gxterkernl-joyeuse-4.14.357-rev187'
          actual="$(cat out/include/config/kernel.release)"
          printf 'kernel.release: %s\n' "$actual"
          test "$actual" = "$release_name"
          grep -Fxq "#define UTS_RELEASE \"$release_name\"" out/include/generated/utsrelease.h

          case "$actual" in
            *XXKSU*|*NOSUSFS*|*SUSFS*)
              echo "forbidden feature label leaked into UTS release: $actual" >&2
              exit 8
              ;;
          esac

          image="out/arch/arm64/boot/Image.gz"
          strings_file="$RUNNER_TEMP/rev187-image.strings"
          test -s "$image"
          gzip -dc "$image" | strings > "$strings_file"
          grep -Fxq "$release_name" "$strings_file"
          grep -Fq "Linux version $release_name" "$strings_file"
          if grep -Fq '4.14.357-Gxter-XXKSU330-NOSUSFS-NBP-FuckMiatollCommu' "$strings_file"; then
            echo 'old feature-labelled UTS identity still present in kernel Image' >&2
            exit 9
          fi

          grep -Fq 'rev187 clean-name compatibility' kernel/module.c
          grep -Fq 'amagic += strcspn(amagic, " ");' kernel/module.c
          grep -Fq 'bmagic += strcspn(bmagic, " ");' kernel/module.c

          source .gx-variant
          zip="artifacts/$GX_ZIP"
          test -s "$zip"
          test "$GX_ZIP" = "${release_name}.zip"
          sha256sum "$zip" > "$zip.sha256"
          md5sum "$zip" > "$zip.md5"
          printf 'source_workflow_187_commit=2642d3182aa72b7524f85b6f8b9a4b389c0aa23e\nsource_behavior=r187-input-test\ncompiled_uts_release=%s\nidentity_mode=clean-real-uts-release\nmodule_compat=ignore-release-token-only\nruntime_root_behavior=preserved-from-r187\n' \
            "$release_name" > "artifacts/${release_name}.release-info.txt"

      - name: Upload failed-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n45-build-log-${{ github.run_number }}
          path: build-compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload flashable ZIP and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: n45-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Gxterkernl joyeuse rev187 GitHub Release
        if: github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='Gxterkernl-joyeuse-4.14.357-rev187'
          zip="artifacts/${tag}.zip"
          test -s "$zip"
          gh release delete "$tag" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$tag" \
            "$zip" \
            "$zip.sha256" \
            "$zip.md5" \
            "artifacts/${tag}.release-info.txt" \
            "artifacts/REV187.config" \
            "artifacts/REV187.build-info.txt" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes 'Based on workflow #187 source behavior (2642d3182aa72b7524f85b6f8b9a4b389c0aa23e). Runtime root functionality is preserved from r187. Public build naming, real UTS_RELEASE and kernel vermagic use only Gxterkernl-joyeuse-4.14.357-rev187. Module loading keeps the r187 ABI checks but ignores only the first vermagic release-name token so a label change alone cannot reject an otherwise matching module.'
