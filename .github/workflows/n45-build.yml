name: Build N45 variant

on:
  push:
    branches:
      - miatoll-nexus45-nbp
      - miatoll-nexus45-nbp-xxksu
      - miatoll-nexus45-nbp-ksun
      - miatoll-nexus45-nbp-xxksu-nosusfs
      - miatoll-nexus45-nbp-ksun-nosusfs
      - miatoll-nexus45-bp
      - miatoll-nexus45-bp-xxksu
      - miatoll-nexus45-bp-ksun
      - miatoll-nexus45-bp-xxksu-nosusfs
      - miatoll-nexus45-bp-ksun-nosusfs
      - gxterkernl-joyeuse-4.14.357-rev187
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout variant
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio curl flex git libelf-dev \
            libssl-dev libxml2-dev lz4 python3 rsync unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build and package
        run: |
          sed -i 's/flags=re.M)/flags=re.M | re.S)/' scripts/gx/apply-bpf-mmapable-array-v2.sh
          bash scripts/gx/apply-netbpfload-bpf-debug.sh
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kernel/sys.c')
          s = p.read_text()
          old = '''\tif (!strncmp(current->comm, "bpfloader", 9) ||
          \t    !strncmp(current->comm, "netbpfload", 10) ||
          \t    !strncmp(current->comm, "netd", 4)) {'''
          new = '''\tif (!strncmp(current->comm, "bpfloader", 9) ||
          \t    !strncmp(current->comm, "netd", 4)) {'''
          if old not in s:
              raise SystemExit('netbpfload uname spoof anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''\t\tstrcpy(tmp.release, "5.4.0");
          \t\tpr_debug("fake uname: %s/%d release=%s\\n",
          \t\t\t current->comm, current->pid, tmp.release);
          \t}'''
          replacement = '''\t\tstrcpy(tmp.release, "5.4.0");
          \t\tpr_debug("fake uname: %s/%d release=%s\\n",
          \t\t\t current->comm, current->pid, tmp.release);
          \t} else if (!strcmp(current->comm, "uname") ||
          \t\t   !strcmp(current->comm, "toybox")) {
          \t\tstrcpy(tmp.release, "Gxterkernl-joyeuse-4.14.357-rev187");
          \t}'''
          if anchor not in s:
              raise SystemExit('uname display spoof anchor not found')
          p.write_text(s.replace(anchor, replacement, 1))
          print('[uname] uname/toybox sees Gxterkernl-joyeuse-4.14.357-rev187; internal UTS stays r187 original')
          PY

          set +e
          set -o pipefail
          bash scripts/gx/build-n45.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-compile.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo '::group::First compiler/linker diagnostics'
            grep -nE '(^|[[:space:]])(error:|fatal error:|undefined reference|ld\.lld: error:|make(\[[0-9]+\])?: \*\*\*)' \
              "$GITHUB_WORKSPACE/build-compile.log" | head -120 || true
            echo '::endgroup::'
            echo '::group::Build log tail'
            tail -250 "$GITHUB_WORKSPACE/build-compile.log" || true
            echo '::endgroup::'
          fi
          exit "$status"

      - name: Verify safe rev187 identity and stage release asset
        if: github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187'
        run: |
          set -euo pipefail
          internal='4.14.357-Gxter-XXKSU330-NOSUSFS-NBP-FuckMiatollCommu/2642d318'
          display='Gxterkernl-joyeuse-4.14.357-rev187'
          actual="$(cat out/include/config/kernel.release)"
          printf 'internal kernel.release: %s\n' "$actual"
          test "$actual" = "$internal"
          grep -Fxq "#define UTS_RELEASE \"$internal\"" out/include/generated/utsrelease.h
          grep -Fq "strcpy(tmp.release, \"$display\")" kernel/sys.c

          image="out/arch/arm64/boot/Image.gz"
          test -s "$image"
          gzip -dc "$image" | strings | grep -Fxq "$internal"
          gzip -dc "$image" | strings | grep -Fxq "$display"

          source .gx-variant
          src="artifacts/$GX_ZIP"
          dst="artifacts/${display}.zip"
          test -s "$src"
          cp "$src" "$dst"
          sha256sum "$dst" > "$dst.sha256"
          md5sum "$dst" > "$dst.md5"
          printf 'source_workflow_187_commit=2642d3182aa72b7524f85b6f8b9a4b389c0aa23e\nsource_variant=%s\ninternal_uts_release=%s\nuname_display=%s\n' "$GX_VARIANT" "$internal" "$display" \
            > "artifacts/${display}.release-info.txt"

      - name: Upload failed-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n45-build-log-${{ github.run_number }}
          path: build-compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload flashable ZIP and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: n45-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish safe Gxterkernl joyeuse rev187 GitHub Release
        if: github.ref_name == 'gxterkernl-joyeuse-4.14.357-rev187'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='Gxterkernl-joyeuse-4.14.357-rev187'
          zip="artifacts/${tag}.zip"
          test -s "$zip"
          gh release delete "$tag" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$tag" \
            "$zip" \
            "$zip.sha256" \
            "$zip.md5" \
            "artifacts/${tag}.release-info.txt" \
            "artifacts/XXKSU330-NOSUSFS-NBP.config" \
            "artifacts/XXKSU330-NOSUSFS-NBP.build-info.txt" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes 'Based exactly on workflow #187 source (2642d3182aa72b7524f85b6f8b9a4b389c0aa23e), the r187 INPUT TEST / lower Simple LMK worker priority for input latency build. To preserve the known-good boot/module ABI, internal UTS_RELEASE is kept exactly as the original r187 value: 4.14.357-Gxter-XXKSU330-NOSUSFS-NBP-FuckMiatollCommu/2642d318. The uname/toybox display path reports Gxterkernl-joyeuse-4.14.357-rev187.'
