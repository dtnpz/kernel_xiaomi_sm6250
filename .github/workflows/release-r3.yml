name: Release N45 r3

on:
  push:
    branches:
      - release-r3-trigger

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release manifest
        uses: actions/checkout@v4

      - name: Verify 10 successful builds and collect assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads release-assets

          specs=(
            '33646111301:miatoll-nexus45-nbp'
            '33646268390:miatoll-nexus45-nbp-xxksu'
            '33646285408:miatoll-nexus45-nbp-ksun'
            '33646301264:miatoll-nexus45-nbp-xxksu-nosusfs'
            '33646317807:miatoll-nexus45-nbp-ksun-nosusfs'
            '33646330666:miatoll-nexus45-bp'
            '33648655838:miatoll-nexus45-bp-xxksu'
            '33646591451:miatoll-nexus45-bp-ksun'
            '33646345412:miatoll-nexus45-bp-xxksu-nosusfs'
            '33646362655:miatoll-nexus45-bp-ksun-nosusfs'
          )

          for spec in "${specs[@]}"; do
            run_id="${spec%%:*}"
            branch="${spec#*:}"
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)"
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .conclusion)"
            head_branch="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_branch)"
            if [[ "$status" != completed || "$conclusion" != success || "$head_branch" != "$branch" ]]; then
              echo "Refusing r3: run $run_id expected $branch, got branch=$head_branch status=$status conclusion=$conclusion" >&2
              exit 10
            fi
            gh run download "$run_id" -n "n45-$branch" -D "downloads/$branch"
          done

          mapfile -t zips < <(find downloads -type f -name 'GXT-Kernel-4.14.357-MIUI-*.zip' | sort)
          if [[ "${#zips[@]}" -ne 10 ]]; then
            echo "Refusing r3: expected exactly 10 4.14.357 flash ZIPs, found ${#zips[@]}" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 11
          fi

          for zip in "${zips[@]}"; do
            unzip -tqq "$zip"
            [[ -s "$zip.sha256" ]] || { echo "Missing $zip.sha256" >&2; exit 12; }
            [[ -s "$zip.md5" ]] || { echo "Missing $zip.md5" >&2; exit 13; }
            (cd "$(dirname "$zip")" && sha256sum -c "$(basename "$zip").sha256")
            (cd "$(dirname "$zip")" && md5sum -c "$(basename "$zip").md5")
            cp "$zip" "$zip.sha256" "$zip.md5" release-assets/
          done

          if [[ "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -ne 10 ]]; then
            echo 'Refusing r3: ZIP asset count changed while collecting' >&2
            exit 14
          fi
          if [[ "$(find release-assets -maxdepth 1 -type f | wc -l)" -ne 30 ]]; then
            echo 'Refusing r3: expected 30 assets (10 ZIP + 10 SHA256 + 10 MD5)' >&2
            exit 15
          fi

          (cd release-assets && sha256sum *.zip | sort) > release-assets/SHA256SUMS.txt
          echo '[r3] all 10 variants verified'

      - name: Create GitHub Release r3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='gxt-4.14.357-miatoll-r3'
          title='GXT-Kernel 4.14.357 — Miatoll r3'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing duplicate." >&2
            exit 20
          fi
          cat > release-notes.md <<'EOF'
          ## GXT-Kernel 4.14.357 — Miatoll r3

          MIUI Android 12 / Miatoll release matrix built on the OpenELA 4.14.357 eLTS baseline.

          ### Variants
          - NONKSU — NBP / BP
          - xxKSU 3.3.0-2 + SUSFS v2.2.0 — NBP / BP
          - KernelSU-Next + SUSFS v2.2.0 — NBP / BP
          - xxKSU 3.3.0-2 without SUSFS — NBP / BP
          - KernelSU-Next without SUSFS — NBP / BP

          ### Integration notes
          - SUSFS variants use the stability-first v2.2.0 profile.
          - KernelSU-Next 4.14 paths use manual/non-kprobe hooks where required.
          - xxKSU 4.14 uses its direct syscall-table path.
          - Every uploaded flash ZIP passed compile/link, required-payload validation, `unzip -tqq`, SHA-256, and MD5 verification in CI.
          EOF
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file release-notes.md
